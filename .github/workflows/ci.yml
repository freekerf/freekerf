name: ci

# The quick checks, on Linux: every pull request (to main and to stable) and main.
# The native runners and the app end to end are in native.yml, the installers in
# release.yml: both run on pull requests to stable (ADR 0018).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push to a pull request cancels the run of the previous one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # keep in sync with rust-toolchain.toml and `rust-version` in Cargo.toml
  # (not TOOLCHAIN: Windows env names ignore case and dtolnay/rust-toolchain uses `toolchain`)
  RUST_TOOLCHAIN: "1.97.0"
  MSRV: "1.88"
  NODE: "24"

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/tauri-deps
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: layer rules
        run: cargo xtask check-layers
      - name: generated docs and TypeScript types are up to date
        run: cargo xtask check-docs
      - name: the Flatpak's offline sources match Cargo.lock and package-lock.json
        run: python3 -I packaging/flatpak/check-sources.py
      - name: design commit pinned in ui/tokens/design.lock
        id: design
        run: echo "commit=$(grep -v '^#' ui/tokens/design.lock | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: freekerf/design
          ref: ${{ steps.design.outputs.commit }}
          path: design
      - name: tokens, icons and fonts match freekerf/design
        run: cargo xtask sync-tokens --design design --check
      - name: LaserGRBL translations (ui/i18n/*/lasergrbl.ftl) match the pinned commit
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/arkypita/LaserGRBL lasergrbl
          cargo xtask resx2ftl --lasergrbl lasergrbl --check
      - name: rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: ./.github/actions/tauri-deps
      # thresholds: doc/coverage.md (90 % workspace, 95 % freekerf-gcode and freekerf-protocol);
      # the desktop shell has its own job (window code needs a display)
      - name: tests with coverage (workspace >= 90 % lines)
        run: cargo llvm-cov --workspace --exclude xtask --exclude freekerf-testkit --exclude freekerf-desktop --fail-under-lines 90 --summary-only
      - name: freekerf-gcode >= 95 % lines
        run: cargo llvm-cov -p freekerf-gcode --fail-under-lines 95 --summary-only
      - name: freekerf-protocol >= 95 % lines
        run: cargo llvm-cov -p freekerf-protocol --fail-under-lines 95 --summary-only

  wasm-core:
    # the core does no I/O: it builds for a target without an operating system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown -p freekerf-gcode -p freekerf-protocol -p freekerf-emulator -p freekerf-session -p freekerf-geometry -p freekerf-document -p freekerf-planner -p freekerf-import -p freekerf-raster

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      # Tauri 2 needs Rust 1.90: the desktop app has its own rust-version
      - run: cargo +${{ env.MSRV }} check --workspace --all-targets --exclude freekerf-desktop

  ui:
    # the web front end: format, lint (architecture rules), types, tests with
    # coverage, production build without the fake service, npm licenses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - name: unit and component tests with coverage
        run: npm run coverage
      - name: coverage in the job summary
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| ui/web (Vitest) | lines | statements | functions | branches |\n|---|---|---|---|---|\n| total | '+['lines','statements','functions','branches'].map(k=>t[k].pct+' %').join(' | ')+' |')" >> "$GITHUB_STEP_SUMMARY"
      - name: web tests in Chromium (long strings in German, three layouts)
        run: |
          npx playwright install --with-deps chromium
          npm run test:web
      - run: npm run build
      - name: the fake service is not in the production bundle
        run: npm run check:bundle
      - name: npm licenses (allow-list compatible with GPL-3.0-or-later)
        run: npm run licenses
      - uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: ui/web/coverage/

  conformance:
    # conformance's protocol and golden (G-code) layers against the Rust build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p freekerf-cli
      - uses: actions/checkout@v4
        with:
          repository: freekerf/conformance
          path: conformance
      - uses: astral-sh/setup-uv@v6
      - name: make test-rust
        working-directory: conformance
        env:
          FREEKERF_BIN: ${{ github.workspace }}/target/debug/freekerf
        run: |
          uv sync
          make test-rust
