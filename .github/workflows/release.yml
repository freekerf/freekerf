name: release

# Installers of the desktop app (PLAN.md M5): Windows (MSI, NSIS), Linux (.deb,
# AppImage), Flatpak and macOS (universal disk image), built and smoke-tested on
# the release train (ADR 0018): a pull request to stable builds and tests them
# (artifacts); a push to stable does the same and, when its version has no tag
# yet, tags it `v<version>` and attaches them to a draft GitHub release. A manual
# run builds and tests them on any branch (artifacts).
on:
  pull_request:
    branches: [stable]
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

# a new push to a pull request cancels its previous run; runs on stable queue
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # keep in sync with ci.yml and rust-toolchain.toml
  RUST_TOOLCHAIN: "1.97.0"
  NODE: "24"
  TAURI_CLI: "2.12.3"

jobs:
  version:
    # one version everywhere, before an hour of builds: Cargo.toml, tauri.conf.json
    # and a <release> in the metainfo; and whether it is already tagged
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.toml, tauri.conf.json and the metainfo agree
        id: version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          cargo=$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$version" = "$cargo" || { echo "tauri.conf.json $version, Cargo.toml $cargo"; exit 1; }
          # the MSI needs a numeric version: 1.2.3 or 1.2.3-4
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$' \
            || { echo "$version is not numeric (the MSI build would fail)"; exit 1; }
          grep -qF "<release version=\"$version\"" packaging/linux/io.github.freekerf.FreeKerf.metainfo.xml \
            || { echo "no <release version=\"$version\"> in the metainfo"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: is v<version> already tagged
        id: tag
        run: |
          version=${{ steps.version.outputs.version }}
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged: no release from this run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "v$version is not tagged: a push to stable tags it and drafts the release" >> "$GITHUB_STEP_SUMMARY"
          fi

  windows:
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
        working-directory: ui/web
      - name: Tauri CLI
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI }} --locked
      # beforeBuildCommand builds ui/web; the CLI turns on `custom-protocol`
      - name: MSI and NSIS installers
        working-directory: apps/desktop
        run: cargo tauri build --ci --bundles msi,nsis
      - name: the installers install, the app starts and stays up, they uninstall
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $nsis = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          # the MSI first: both remember their folder in the same registry key, which the
          # NSIS uninstaller leaves, and the MSI would reuse it instead of Program Files
          ./.github/scripts/smoke-windows-installer.ps1 -Installer $msi.FullName -Kind msi
          ./.github/scripts/smoke-windows-installer.ps1 -Installer $nsis.FullName -Kind nsis
      - name: checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/bundle/msi/*.msi, target/release/bundle/nsis/*-setup.exe dist/
          Get-ChildItem dist | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt
          Get-Content dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: freekerf-windows
          path: dist/
          if-no-files-found: error

  linux:
    # the oldest supported Ubuntu: the .deb and the AppImage need its glibc or newer
    needs: [version]
    runs-on: ubuntu-22.04
    env:
      # linuxdeploy (AppImage) is itself an AppImage: no FUSE needed
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: metainfo and desktop entry are valid (AppStream 1.x of Ubuntu 24.04)
        run: |
          docker run --rm -v "$PWD/packaging/linux:/p:ro" ubuntu:24.04 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq appstream desktop-file-utils ca-certificates >/dev/null
            appstreamcli validate --explain /p/io.github.freekerf.FreeKerf.metainfo.xml
            sed "s/{{exec}}/freekerf-desktop/g; s/{{icon}}/io.github.freekerf.FreeKerf/" \
              /p/io.github.freekerf.FreeKerf.desktop.in > /tmp/io.github.freekerf.FreeKerf.desktop
            desktop-file-validate /tmp/io.github.freekerf.FreeKerf.desktop'
      - uses: ./.github/actions/tauri-deps
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
        working-directory: ui/web
      - name: Tauri CLI
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI }} --locked
      # the .deb and the AppImage ship it as /usr/bin/freekerf (bundle.linux.*.files)
      - name: the freekerf CLI
        run: cargo build --release --locked -p freekerf-cli
      - name: .deb and AppImage
        working-directory: apps/desktop
        run: cargo tauri build --ci --bundles deb,appimage
      - name: the .deb installs, the app starts and stays up, it uninstalls (Ubuntu 24.04)
        run: |
          deb=$(ls target/release/bundle/deb/*.deb | head -n1)
          docker run --rm -v "$PWD:/w:ro" -w /w ubuntu:24.04 \
            .github/scripts/smoke-linux-installer.sh deb "$deb"
      - name: the AppImage starts and stays up (Ubuntu 24.04)
        run: |
          appimage=$(ls target/release/bundle/appimage/*.AppImage | head -n1)
          docker run --rm -v "$PWD:/w:ro" -w /w ubuntu:24.04 bash -euc '
            cp "$1" /tmp/app.AppImage
            .github/scripts/smoke-linux-installer.sh appimage /tmp/app.AppImage' _ "$appimage"
      # another distribution's WebKit/EGL stack: reported, not blocking (see the PR)
      - name: the AppImage on Fedora
        continue-on-error: true
        run: |
          appimage=$(ls target/release/bundle/appimage/*.AppImage | head -n1)
          docker run --rm -v "$PWD:/w:ro" -w /w fedora:latest bash -euc '
            cp "$1" /tmp/app.AppImage
            .github/scripts/smoke-linux-installer.sh appimage /tmp/app.AppImage' _ "$appimage"
      - name: checksums
        run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist/
          (cd dist && sha256sum -- * > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: freekerf-linux
          path: dist/
          if-no-files-found: error

  macos:
    # Apple Silicon runner; one universal disk image (arm64 + x86_64), signed ad hoc
    # (no Developer ID yet: not notarized, see the roadmap)
    needs: [version]
    runs-on: macos-latest
    env:
      TARGETS: aarch64-apple-darwin x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
        working-directory: ui/web
      - name: Tauri CLI
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI }} --locked
      # the app ships it as Contents/MacOS/freekerf, a Tauri sidecar (signed with the
      # app): packaging/macos/tauri.cli.json wants target/sidecar/freekerf-<triple>,
      # one per architecture for the build and the universal one for the bundle
      - name: the freekerf CLI (universal)
        run: |
          mkdir -p target/sidecar
          for t in $TARGETS; do
            cargo build --release --locked -p freekerf-cli --target "$t"
            cp "target/$t/release/freekerf" "target/sidecar/freekerf-$t"
          done
          lipo -create -output target/sidecar/freekerf-universal-apple-darwin \
            target/aarch64-apple-darwin/release/freekerf target/x86_64-apple-darwin/release/freekerf
          lipo -info target/sidecar/freekerf-universal-apple-darwin
      - name: .app and disk image
        working-directory: apps/desktop
        run: |
          cargo tauri build --ci --target universal-apple-darwin --bundles app,dmg \
            --config ../../packaging/macos/tauri.cli.json
      - name: the disk image mounts, the app is universal and signed, starts and stays up, the CLI attaches over MCP
        run: |
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
          .github/scripts/smoke-macos-installer.sh "$dmg"
      - name: checksums
        run: |
          mkdir dist
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
          (cd dist && shasum -a 256 -- * > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: freekerf-macos
          path: dist/
          if-no-files-found: error

  flatpak:
    # the build only: the container is the freedesktop SDK image (no package
    # manager, no Xvfb); flatpak-test installs and runs the bundle
    needs: [version]
    runs-on: ubuntu-latest
    container:
      # keep the tag in step with runtime-version in the manifest
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: FreeKerf.flatpak
          manifest-path: packaging/flatpak/io.github.freekerf.FreeKerf.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.json') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: FreeKerf.flatpak
          if-no-files-found: error

  flatpak-test:
    needs: [flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # offline: comparing the lock files needs no registry (a 502 from npm failed
      # the regeneration here once)
      - name: the offline sources match the lock files
        run: python3 -I packaging/flatpak/check-sources.py
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
      - name: Flatpak and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends flatpak xvfb xauth >/dev/null
      - name: the bundle installs, the app starts and stays up, the CLI attaches over MCP, it uninstalls
        run: sudo .github/scripts/smoke-linux-installer.sh flatpak FreeKerf.flatpak
      - name: checksums
        run: |
          mkdir dist
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          cp FreeKerf.flatpak "dist/FreeKerf_${version}_x86_64.flatpak"
          (cd dist && sha256sum -- * > SHA256SUMS-flatpak.txt && cat SHA256SUMS-flatpak.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: freekerf-flatpak
          path: dist/
          if-no-files-found: error

  publish:
    # a push to stable with a new version: the tag, then a draft release; a
    # maintainer writes the notes from CHANGELOG.md and publishes it
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable' && needs.version.outputs.tagged == 'false'
    needs: [version, windows, linux, macos, flatpak-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: freekerf-*
          merge-multiple: true
      # pushed here, not by the draft: a draft release creates its tag only when it
      # is published, and the next push to stable must see this version as released
      # (a tag pushed with GITHUB_TOKEN starts no other workflow)
      - name: tag the commit that was built
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "FreeKerf ${TAG#v}" --generate-notes dist/*
