[workspace]
exclude = ["fuzz"]
resolver = "3"
members = [
    "crates/core/*",
    "crates/config/*",
    "crates/native/*",
    "crates/runtime/*",
    "crates/testing/*",
    "apps/cli",
    "apps/desktop/src-tauri",
    "tests",
    "tools/xtask",
]
default-members = [
    "crates/core/*",
    "crates/config/*",
    "crates/native/*",
    "crates/runtime/*",
    "crates/testing/*",
    "apps/cli",
    "tests",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["The FreeKerf contributors"]
repository = "https://github.com/freekerf/freekerf"
homepage = "https://github.com/freekerf"
publish = false

[workspace.dependencies]
# workspace crates
freekerf-gcode = { path = "crates/core/freekerf-gcode", default-features = false }
freekerf-protocol = { path = "crates/core/freekerf-protocol" }
freekerf-emulator = { path = "crates/core/freekerf-emulator" }
freekerf-session = { path = "crates/core/freekerf-session" }
freekerf-geometry = { path = "crates/core/freekerf-geometry" }
freekerf-materials = { path = "crates/config/freekerf-materials" }
freekerf-migrate = { path = "crates/config/freekerf-migrate" }
# the materials library, by git (no release yet; PLAN §2)
freekerf-library = { git = "https://github.com/freekerf/library", rev = "e27f3c07001739d436d074b7871b0f475db82856" }
freekerf-document = { path = "crates/core/freekerf-document" }
freekerf-planner = { path = "crates/core/freekerf-planner" }
freekerf-import = { path = "crates/core/freekerf-import" }
freekerf-raster = { path = "crates/core/freekerf-raster" }
freekerf-text = { path = "crates/core/freekerf-text" }
freekerf-settings = { path = "crates/config/freekerf-settings" }
freekerf-script = { path = "crates/runtime/freekerf-script" }
freekerf-transport = { path = "crates/native/freekerf-transport" }
freekerf-platform = { path = "crates/native/freekerf-platform" }
freekerf-machine = { path = "crates/runtime/freekerf-machine" }
freekerf-service = { path = "crates/runtime/freekerf-service" }
freekerf-ipc = { path = "crates/native/freekerf-ipc" }
freekerf-mcp = { path = "crates/runtime/freekerf-mcp" }
freekerf-testkit = { path = "crates/testing/freekerf-testkit" }

# third party
anyhow = "1"
base64 = "0.22"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", default-features = false }
crossbeam-channel = "0.5"
ctrlc = "3"
directories = "6"
getrandom = "0.3"
# installed fonts (freekerf-platform): fontconfig's folders, no memory maps
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "fontconfig"] }
# local sockets: Unix domain sockets and Windows named pipes (freekerf-ipc)
interprocess = "2"
# QuickJS (MIT), the script engine: ADR 0011
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
# raw deflate (LaserGRBL .zbn button exports)
miniz_oxide = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
insta = { version = "1", features = ["json"] }
nix = { version = "0.31", features = ["term", "fs", "poll", "user"] }
predicates = "3"
proptest = "1"
rayon = "1"
regex = "1"
roxmltree = "0.21"
# text shaping (kerning, ligatures, marks) and font outlines (freekerf-text):
# HarfBuzz's and Google Fonts' crates, on the same read-fonts (ADR 0019)
harfrust = "0.15"
skrifa = "0.49"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serialport = { version = "4", default-features = false }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
# selected pedantic lints (see AGENTS.md); the rest of pedantic stays off
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
if_not_else = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
